services:
  - type: web
    name: flame-in-freefall-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: QDRANT_PATH
        value: ./qdrant_data
      - key: DISABLE_RERANKER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
